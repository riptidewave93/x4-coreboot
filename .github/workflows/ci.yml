# Lint and build with the same make targets as local development: on pull requests and
# on main. On main, Release-Please keeps a release PR open. Merging it tags a draft
# release; this workflow builds that commit with the release version, attaches the
# production build and publishes the release. Release runs skip the debug build.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: make lint

  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    # Also runs when release-please is skipped (pull requests)
    if: ${{ !cancelled() && needs.release-please.result != 'failure' }}
    runs-on: ubuntu-26.04
    # The first run builds the toolchain; later runs restore it from the cache
    timeout-minutes: 240
    env:
      # Empty except for a release: then the coreboot version carries it
      RELEASE: ${{ needs.release-please.outputs.created && needs.release-please.outputs.version || '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the coreboot version
        id: pins
        run: echo "coreboot=$(sed -n 's/^export COREBOOT_VER := //p' Makefile)" >> "$GITHUB_OUTPUT"

      - name: Cache the toolchain
        uses: actions/cache@v6
        with:
          path: preserve/toolchain
          key: toolchain-${{ steps.pins.outputs.coreboot }}

      # Keyed on the Makefile pins; no restore-keys, so stale downloads don't pile up
      - name: Cache the downloads
        uses: actions/cache@v6
        with:
          path: preserve/dl
          key: dl-${{ hashFiles('Makefile') }}

      - name: Build production
        run: make RELEASE="$RELEASE"

      - name: Build debug
        if: env.RELEASE == ''
        run: make DEBUG=1

      # Needs the build tree and a built image
      - name: Test UART flash mode
        run: make test-uart-flash

      - name: Check the outputs
        run: |
          shopt -s nullglob
          for d in output/*-radxa-x4 output/*-radxa-x4-debug; do
            (cd "$d" && sha256sum -c SHA256SUMS)
            name="${d#output/}"
            mv "$d" "output/${name#*-*-}"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: radxa-x4
          path: output/radxa-x4/

      - uses: actions/upload-artifact@v7
        if: env.RELEASE == ''
        with:
          name: radxa-x4-debug
          path: output/radxa-x4-debug/

  publish:
    needs: [lint, release-please, build]
    if: needs.release-please.outputs.created
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: radxa-x4
          path: radxa-x4

      - name: Attach the builds and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          cd radxa-x4
          mapfile -t files < <(awk '{print $2}' SHA256SUMS)
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            "${files[@]}" SHA256SUMS versions.txt
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
