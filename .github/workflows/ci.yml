# Lint and build with the same make targets as local development, on pull requests and
# on main. Debug builds are opt-in: the debug-build label on a pull request, or a manual
# run with the debug build type. On main, Release-Please keeps a release PR open. Merging
# it tags a draft release; this workflow builds the tagged commit with the release
# version, attaches the production build and publishes the release.
name: CI

on:
  pull_request:
    # closed cancels the build of a merged or closed pull request
    types: [opened, synchronize, reopened, closed, labeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build:
        description: Build type
        type: choice
        options: [production, debug]
        default: production

permissions:
  contents: read

# A pull request's newest event cancels its running build. Pull requests group by number,
# not github.ref: a merged PR's closed event has the base branch as its ref. Pushes to
# main are never cancelled, and manual runs and labels other than debug-build get their
# own group, so neither can displace a queued main run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && format('ci-{0}', github.ref) || format('ci-manual-{0}', github.run_id) }}${{ github.event.action == 'labeled' && github.event.label.name != 'debug-build' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    if: github.event.action != 'closed' && (github.event.action != 'labeled' || github.event.label.name == 'debug-build')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: make lint

  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
      sha: ${{ steps.rp.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    # Also runs when release-please is skipped (pull requests, manual runs)
    if: >-
      !cancelled() && needs.release-please.result != 'failure' &&
      github.event.action != 'closed' &&
      (github.event.action != 'labeled' || github.event.label.name == 'debug-build')
    runs-on: ubuntu-26.04
    # The first run builds the toolchain; later runs restore it from the cache
    timeout-minutes: 240
    env:
      # Empty except for a release: then the coreboot version carries it
      RELEASE: ${{ needs.release-please.outputs.created && needs.release-please.outputs.version || '' }}
      PRODUCTION: ${{ github.event_name != 'workflow_dispatch' || inputs.build != 'debug' }}
      DEBUG: ${{ (github.event_name == 'workflow_dispatch' && inputs.build == 'debug') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'debug-build')) }}
    steps:
      # A release builds the commit Release-Please tagged, even if main has moved on
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.created && needs.release-please.outputs.sha || '' }}

      - name: Read the coreboot version
        id: pins
        run: echo "coreboot=$(sed -n 's/^export COREBOOT_VER := //p' Makefile)" >> "$GITHUB_OUTPUT"

      - name: Cache the toolchain
        uses: actions/cache@v6
        with:
          path: preserve/toolchain
          key: toolchain-${{ steps.pins.outputs.coreboot }}

      # Keyed on the Makefile pins; no restore-keys, so stale downloads don't pile up
      - name: Cache the downloads
        uses: actions/cache@v6
        with:
          path: preserve/dl
          key: dl-${{ hashFiles('Makefile') }}

      - name: Build production
        if: env.PRODUCTION == 'true'
        run: make RELEASE="$RELEASE"

      - name: Build debug
        if: env.DEBUG == 'true'
        run: make DEBUG=1

      # Needs the build tree and a built image
      - name: Test UART flash mode
        run: make test-uart-flash

      - name: Check the outputs
        run: |
          shopt -s nullglob
          for d in output/*-radxa-x4 output/*-radxa-x4-debug; do
            (cd "$d" && sha256sum -c SHA256SUMS)
            name="${d#output/}"
            mv "$d" "output/${name#*-*-}"
          done

      - uses: actions/upload-artifact@v7
        if: env.PRODUCTION == 'true'
        with:
          name: radxa-x4
          path: output/radxa-x4/
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: env.DEBUG == 'true'
        with:
          name: radxa-x4-debug
          path: output/radxa-x4-debug/
          retention-days: 7

  publish:
    needs: [lint, release-please, build]
    if: needs.release-please.outputs.created
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: radxa-x4
          path: radxa-x4

      - name: Attach the builds and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          cd radxa-x4
          mapfile -t files < <(awk '{print $2}' SHA256SUMS)
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            "${files[@]}" SHA256SUMS versions.txt
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
